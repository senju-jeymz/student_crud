services:
  - type: web
    name: student-crud-frontend
    runtime: static
    rootDir: student-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: "" # Set your deployed Spring Boot URL here (e.g. https://your-backend.onrender.com)
