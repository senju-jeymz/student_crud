services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: student-backend
    runtime: docker
    plan: free
    dockerContext: ./student
    dockerfilePath: ./student/Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: student-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: student-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: student-db
          property: password

  # 2. Vite React Frontend Static Site
  - type: web
    name: student-crud-frontend
    runtime: static
    rootDir: student-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: student-backend
          envVarKey: RENDER_EXTERNAL_URL

# 3. PostgreSQL Database
databases:
  - name: student-db
    databaseName: db_student
    user: student_user
    plan: free
